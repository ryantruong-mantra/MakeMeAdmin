name: ARM64 Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-arm64:
    runs-on: windows-latest
    
    permissions:
      contents: read
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2
      
    - name: Setup NuGet
      uses: nuget/setup-nuget@v2
      
    - name: Install WiX Toolset
      run: |
        curl -L -o wix311.exe https://github.com/wixtoolset/wix3/releases/download/wix3112rtm/wix311.exe
        .\wix311.exe /install /quiet /norestart
        # Add WiX to PATH
        echo "C:\Program Files (x86)\WiX Toolset v3.11\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      shell: powershell
      
    - name: Restore NuGet packages
      run: nuget restore MakeMeAdmin.sln
      
    - name: Build Solution (ARM64)
      run: msbuild MakeMeAdmin.sln /p:Configuration=Release /p:Platform=ARM64 /m /v:minimal
      
    - name: List MSI output
      run: |
        echo "Setup output:"
        dir Setup\bin\Release*
        echo ""
        echo "Installers folder:"
        dir Installers\ 2>$null || echo "Installers folder not found"
      shell: pwsh
      continue-on-error: true
      
    - name: Upload ARM64 MSI Installer
      uses: actions/upload-artifact@v4
      with:
        name: MakeMeAdmin-ARM64-Installer
        path: Installers/*.msi
        if-no-files-found: error
