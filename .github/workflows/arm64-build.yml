name: ARM64 Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-arm64:
    runs-on: windows-latest
    
    permissions:
      contents: read
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2
      
    - name: Setup NuGet
      uses: nuget/setup-nuget@v2
      
    - name: Install WiX Toolset
      run: |
        Write-Host "Downloading WiX Toolset v3.11..."
        $wixUrl = "https://github.com/wixtoolset/wix3/releases/download/wix3112rtm/wix311.exe"
        $wixInstaller = "$env:TEMP\wix311.exe"
        
        Invoke-WebRequest -Uri $wixUrl -OutFile $wixInstaller -UseBasicParsing
        
        if (Test-Path $wixInstaller) {
          Write-Host "Installing WiX Toolset..."
          Start-Process -FilePath $wixInstaller -ArgumentList "/install", "/quiet", "/norestart" -Wait -PassThru
          
          Write-Host "Waiting for installation to complete..."
          Start-Sleep -Seconds 10
          
          $wixPath = "C:\Program Files (x86)\WiX Toolset v3.11\bin"
          if (Test-Path $wixPath) {
            Write-Host "WiX installed successfully at: $wixPath"
            # Add to PATH for current step and future steps
            $env:PATH = "$wixPath;$env:PATH"
            Add-Content -Path $env:GITHUB_PATH -Value $wixPath
            
            # Verify installation
            if (Test-Path "$wixPath\candle.exe") {
              Write-Host "WiX candle.exe found"
            }
            if (Test-Path "$wixPath\light.exe") {
              Write-Host "WiX light.exe found"
            }
          } else {
            Write-Host "WARNING: WiX installation path not found at expected location"
            Write-Host "Checking common installation locations..."
            Get-ChildItem "C:\Program Files (x86)\" -Directory | Where-Object { $_.Name -like "*WiX*" }
          }
        } else {
          Write-Error "Failed to download WiX installer"
          exit 1
        }
      shell: pwsh
      
    - name: Restore NuGet packages
      run: nuget restore MakeMeAdmin.sln
      
    - name: Verify WiX Installation
      run: |
        Write-Host "Checking WiX installation..."
        Write-Host "PATH: $env:PATH"
        Write-Host ""
        
        $wixPath = "C:\Program Files (x86)\WiX Toolset v3.11\bin"
        if (Test-Path $wixPath) {
          Write-Host "WiX directory exists: $wixPath"
          Get-ChildItem $wixPath
        } else {
          Write-Host "ERROR: WiX directory not found at $wixPath"
        }
        
        Write-Host ""
        Write-Host "Searching for candle.exe..."
        $candle = Get-Command candle.exe -ErrorAction SilentlyContinue
        if ($candle) {
          Write-Host "Found: $($candle.Source)"
        } else {
          Write-Host "ERROR: candle.exe not found in PATH"
        }
        
        Write-Host ""
        Write-Host "Searching for light.exe..."
        $light = Get-Command light.exe -ErrorAction SilentlyContinue
        if ($light) {
          Write-Host "Found: $($light.Source)"
        } else {
          Write-Host "ERROR: light.exe not found in PATH"
        }
      shell: pwsh
      continue-on-error: true
      
    - name: Build Solution (ARM64)
      run: msbuild MakeMeAdmin.sln /p:Configuration=Release /p:Platform=ARM64 /m /v:minimal
      
    - name: List MSI output
      run: |
        Write-Host "Setup output:"
        Get-ChildItem Setup\bin\Release* -ErrorAction SilentlyContinue
        Write-Host ""
        Write-Host "Installers folder:"
        if (Test-Path Installers\) {
          Get-ChildItem Installers\
        } else {
          Write-Host "Installers folder not found"
        }
      shell: pwsh
      continue-on-error: true
      
    - name: Upload ARM64 MSI Installer
      uses: actions/upload-artifact@v4
      with:
        name: MakeMeAdmin-ARM64-Installer
        path: Installers/*.msi
        if-no-files-found: error
